name: Linux port checks
on:
  pull_request:
    paths:
      - 'scripts/linux/**'
      - 'tests/linux/**'
      - '.github/workflows/linux-port-checks.yml'
      - 'src/timer_policy.h'
      - 'tests/timer_policy_test.cpp'
  push:
    branches:
      - 'feat/steamdeck-proton-linux-port'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax checks
        run: |
          bash -n scripts/linux/azs-proton-diagnostics.sh
          bash -n scripts/linux/azs-proton-controller.sh
          bash -n tests/linux/smoke.sh
          bash -n scripts/linux/package-deck-diagnostics.sh
          bash -n tests/linux/package_smoke.sh
          python3 -m py_compile scripts/linux/azs-runtime-discovery.py scripts/linux/azs-process-probe.py scripts/linux/azs-compat-report.py scripts/linux/azs-launch-log-summary.py scripts/linux/azs-connection-preflight.py
      - name: Shellcheck
        run: |
          shellcheck scripts/linux/azs-proton-diagnostics.sh scripts/linux/azs-proton-controller.sh tests/linux/smoke.sh
      - name: Prefix discovery unit tests
        run: python3 -m unittest discover -s tests/linux -p 'test_*.py' -v
      - name: Safe smoke tests
        run: bash tests/linux/smoke.sh
      - name: Portable timer policy tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I src tests/timer_policy_test.cpp -o /tmp/azs-timer-policy-test
          /tmp/azs-timer-policy-test

      - name: Build and verify Steam Deck diagnostic ZIP
        run: bash tests/linux/package_smoke.sh
      - name: Package Steam Deck diagnostic ZIP
        run: bash scripts/linux/package-deck-diagnostics.sh dist
      - name: Upload Steam Deck diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZS-Deck-Diagnostics
          path: |
            dist/AZS-Deck-Diagnostics.zip
            dist/AZS-Deck-Diagnostics.zip.sha256
          if-no-files-found: error
          retention-days: 14
